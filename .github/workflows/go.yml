# 持续集成：依赖校验、静态检查与构建。
#
# 与 pages.yml 的分工：这里只验证，不发布，因此不装 binaryen、不做 wasm-opt
# ——未优化的 WASM 足够证明能编译，而 Pages 那条要发布的才是优化过的产物。
# 发布走 pages.yml，只在 main 分支的特定路径变化时触发。
#
# 完整本地测试尚未入库；这里直接运行已入库的 WASM 比较回归测试。
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ofd-toolbox
    steps:
      - uses: actions/checkout@v7
        with:
          path: ofd-toolbox

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true
          cache: true
          cache-dependency-path: ofd-toolbox/go.sum

      # 每次 CI 都解析 ofd 仓库 main 分支的最新提交。升级后保存快照，再跑 tidy
      # 并核对快照，这样仍能发现依赖清单不整洁，同时允许锁文件正常更新。
      - name: Update OFD dependency
        run: |
          go get github.com/zc310/ofd@main
          cp go.mod /tmp/go.mod.latest
          cp go.sum /tmp/go.sum.latest
          go mod tidy
          diff -u /tmp/go.mod.latest go.mod && diff -u /tmp/go.sum.latest go.sum || {
            echo "::error::go.mod / go.sum 与 go mod tidy 的结果不一致"
            exit 1
          }

      # 不用 go build ./... 一步带过：本项目只有 js/wasm 一套实现，
      # cmd/toolbox-wasm 下每个文件都带 //go:build js && wasm，宿主机下匹配不到包。
      # 仓库里没有宿主目标的包，所以只在 GOOS=js 下查。
      - name: Vet
        run: GOOS=js GOARCH=wasm go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/toolbox-wasm

      # 走一遍真实的构建路径，顺带把 wasm_exec.js 拷到 web/ 下、按内容哈希
      # 生成 service-worker.js。这一步能抓到前面 go build 抓不到的问题：
      # Makefile 里的 WASM_OPT_FLAGS 与 wasm-opt 版本不匹配之类。
      # 本机没装 wasm-opt 时它会告警并改用未优化版本，那不算失败。
      - name: Build WASM
        run: make build-wasm

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test WASM
        run: node --test cmd/toolbox-wasm/tests/*.test.mjs
